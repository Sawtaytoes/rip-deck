<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Rip-Deck">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a970ff"/>
      <stop offset="1" stop-color="#6d3bf5"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#1b1f24"/>
  <!-- eject triangle: the rip/eject motion -->
  <path d="M128 34 L166 80 L90 80 Z" fill="url(#g)"/>
  <!-- optical disc: ring + hub -->
  <circle cx="128" cy="150" r="60" fill="none" stroke="url(#g)" stroke-width="14"/>
  <circle cx="128" cy="150" r="15" fill="#1b1f24" stroke="url(#g)" stroke-width="8"/>
</svg>
