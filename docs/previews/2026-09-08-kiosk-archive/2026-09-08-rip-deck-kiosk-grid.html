<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nine-slot kiosk preview</title>
<style>
*{box-sizing:border-box}body{margin:0;width:480px;height:320px;overflow:hidden;background:#0a111b;color:#f5f8ff;font-family:Arial,sans-serif}#grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;padding:4px;width:480px;height:320px}.slot{display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid #526880;border-radius:4px;padding:7px;background:#172638;color:inherit;font:inherit;touch-action:manipulation}.top{display:flex;align-items:baseline;justify-content:space-between}.number{font-size:19px;font-weight:bold}.percent{font-size:26px;font-weight:bold;letter-spacing:-1px}.state{font-size:15px;color:#c4d6ee}.track{height:12px;background:#37495d;overflow:hidden;border-radius:2px}.bar{height:100%;background:#5cbdff}.info{font-size:14px;color:#d0deee}.pass .state,.pass .percent{color:#7df3b7}.pass .bar{background:#53e9a2}.fail .state,.fail .percent{color:#ffaba5}.fail .bar{background:#ff8177}button:active{background:#385777}#detail{display:none;position:absolute;inset:0;background:#172638;padding:20px}#detail h2{font-size:25px;margin:0 0 15px}#detail p{font-size:17px;line-height:1.4}#detail button{font:18px Arial;color:white;background:#304766;border:1px solid #8aa4c5;border-radius:5px;min-height:52px;padding:8px 14px;margin:4px}#detail #back{position:absolute;bottom:12px;left:16px}
</style><div id="grid"></div><div id="detail"><h2 id="title"></h2><p id="description"></p><button class="action">Open</button><button class="action">Close</button><button class="action">Disc removed</button><p id="result">Preview only. All actions are simulated.</p><button id="back">Back</button></div>
<script>
const grid=document.querySelector('#grid');let selected=0;
const start=[75,88,100,14,27,42,53,66,79];const types=['DVD','CD','Blu-ray','DVD','CD','DVD','Blu-ray','DVD','CD'];const began=Date.now();
for(let i=0;i<9;i++){const button=document.createElement('button');button.className='slot'+(i===2?' pass':i===5?' fail':'');button.innerHTML=`<div class="top"><span class="number">Slot ${i+1}</span><span class="percent"></span></div><div class="state"></div><div class="track"><div class="bar"></div></div><div class="info"></div>`;button.onclick=()=>{selected=i;document.querySelector('#title').textContent=`Slot ${i+1}`;document.querySelector('#description').textContent=`${types[i]} · ${i===2?'Ready to remove':i===5?'Read error':'Ripping in progress'}`;document.querySelector('#result').textContent='Preview only. All actions are simulated.';document.querySelector('#detail').style.display='block'};grid.append(button)}
window.advance=()=>document.querySelectorAll('.slot').forEach((slot,i)=>{const percent=i===2?100:i===5?42:Math.min(99,start[i]+Math.floor((Date.now()-began)/15000));slot.querySelector('.percent').textContent=`${percent}%`;slot.querySelector('.state').textContent=i===2?'Ready to remove':i===5?'Read error':'Ripping';slot.querySelector('.bar').style.width=`${percent}%`;slot.querySelector('.info').textContent=i===2?`${types[i]} · Complete`:i===5?`${types[i]} · Check disc`:`${types[i]} · ~${100-percent} min`});window.advance();
document.querySelector('#back').onclick=()=>document.querySelector('#detail').style.display='none';document.querySelectorAll('.action').forEach(button=>button.onclick=()=>document.querySelector('#result').textContent=`Slot ${selected+1}: ${button.textContent} acknowledged (test).`);
</script></html>
