name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # yarn is vendored at .yarn/releases and pinned by `yarnPath`,
      # so corepack has nothing to fetch. This only guarantees it can
      # never stop and ask.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install
        # --immutable so a lockfile that disagrees with package.json
        # fails here instead of resolving to something no one ran.
        run: corepack enable && yarn install --immutable

      - name: Install Playwright chromium
        # The web suite runs in vitest browser mode, which needs a real
        # chromium plus its system libraries. `--with-deps` pulls the OS
        # packages; chromium only, no firefox/webkit.
        run: yarn install-playwright-browser

      - name: Typecheck
        # Both halves are needed. The root tsconfig excludes `packages`,
        # so a bare `tsc --noEmit` at the root checks exactly one file
        # and would sail past any error in the daemon or the contracts.
        run: |
          npx tsc --noEmit
          yarn workspaces foreach -Ap run typecheck

      - name: Lint — formatting and syntax
        # `check .`, not the repo's `lint:biome` (which passes
        # --write --unsafe and would have CI rewriting the tree).
        run: npx biome check .

      - name: Lint — type-aware
        # Same reason the biome step drops --write: `lint:eslint` --fix.
        run: npx eslint .

      - name: Tests
        # `vitest run`, not the repo's bare `vitest`, which would sit in
        # watch mode forever.
        run: npx vitest run

      - name: Check optimizeDeps.include parity
        # AFTER the tests, deliberately: Vite's optimizer writes its
        # metadata as it discovers, so before a run there is nothing to
        # compare and mid-run the picture is incomplete.
        #
        # This guards a race rather than a determinate break. An
        # undeclared dependency gets discovered part-way through a run,
        # which re-optimises and reloads the page under the tests —
        # surfacing as a `useMemoCache` null crash or `Failed to fetch
        # dynamically imported module`, neither of which names the
        # missing package. An incomplete list therefore PASSES until it
        # doesn't, which is exactly how this repo went four entries
        # short without anyone noticing.
        #
        # The cache lives beside the package, not at the repo root.
        working-directory: packages/web
        run: >-
          npx charcuterie-check-optimize-deps ./optimizeDeps.js
          --cache-dir node_modules/.vite

  # Build the runtime image and push it to GHCR; TrueNAS pulls it from
  # there and force-pulls `:latest` on `midclt call app.redeploy rip-deck`
  # (mirrors castkit's docker-deploy). Skipped on pull_request.
  #
  # ⚠️ The image contains MakeMKV (proprietary, GuinpinSoft EULA) via the
  # jlesage base. The GHCR package starts PRIVATE; making it public
  # redistributes those binaries — a deliberate, separate step.
  #
  # ⚠️ This image bakes `config/drives.json`, which is the EXAMPLE slot
  # map in this public repo. A real deployment must mount its own
  # `drives.json` over `/app/config/drives.json` (or set
  # RIP_DECK_DRIVES_CONFIG to a mounted path) or every bay resolves to
  # "UNKNOWN DRIVE".
  docker-deploy:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # rip-deck keeps its own semver image tag alongside the fleet's
      # moving `:latest`; `package.json` version is the source of truth.
      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # One `docker build` produces BOTH the long-running container and
      # the per-rip isolation container.
      - name: Build image
        run: |
          docker build \
            -t ghcr.io/sawtaytoes/rip-deck:latest \
            -t ghcr.io/sawtaytoes/rip-deck:${{ github.sha }} \
            -t ghcr.io/sawtaytoes/rip-deck:${{ steps.meta.outputs.version }} \
            .

      - name: Push image
        run: |
          docker push ghcr.io/sawtaytoes/rip-deck:latest
          docker push ghcr.io/sawtaytoes/rip-deck:${{ github.sha }}
          docker push ghcr.io/sawtaytoes/rip-deck:${{ steps.meta.outputs.version }}
